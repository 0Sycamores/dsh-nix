name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  cheap-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: cheap checks (no desktop build)
        run: bash scripts/check.sh
